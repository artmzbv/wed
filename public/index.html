<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#44423e" />
    <!-- Сайт рассчитан только на светлую тему — запрещаем авто-тёмный режим
         браузеров (Chrome Force-Dark, «Ночной режим» Samsung Internet),
         иначе они перекрашивают фон и цвета (напр. образцы палитры в дресс-коде). -->
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="Николай и Инна приглашают вас разделить радость свадебного дня — 25 августа 2026"
    />

    <!-- Open Graph (превью ссылки в Telegram, WhatsApp, соцсетях).
         og:image и og:url — АБСОЛЮТНЫЕ адреса, иначе Telegram не подтянет. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Николай и Инна" />
    <meta property="og:title" content="Николай и Инна" />
    <meta
      property="og:description"
      content="Николай и Инна приглашают вас разделить радость свадебного дня — 25 августа 2026"
    />
    <meta property="og:url" content="https://frompokrovskywithlove.ru/" />
    <meta property="og:image" content="https://frompokrovskywithlove.ru/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:locale" content="ru_RU" />

    <!-- Twitter Card (используют и некоторые другие краулеры) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Николай и Инна" />
    <meta
      name="twitter:description"
      content="Николай и Инна приглашают вас разделить радость свадебного дня — 25 августа 2026"
    />
    <meta name="twitter:image" content="https://frompokrovskywithlove.ru/og-image.jpg" />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Инна&Николай · 25 августа 2026</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
    </div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
